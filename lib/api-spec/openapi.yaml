openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: abstractly
    description: Abstractly scored papers and feedback
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /abstractly/papers:
    get:
      operationId: listScoredPapers
      tags: [abstractly]
      summary: List scored papers
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
        - in: query
          name: view
          required: false
          schema:
            type: string
            enum: [all, read_later]
            default: all
      responses:
        "200":
          description: Scored papers ordered by relevance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoredPaper"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No subscription found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /abstractly/read-later:
    post:
      operationId: setReadLater
      tags: [abstractly]
      summary: Save or remove a paper from Read Later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadLaterInput"
      responses:
        "200":
          description: Read Later state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadLaterResponse"
        "400":
          description: Invalid Read Later request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User or paper not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /abstractly/settings:
    get:
      operationId: getFeedSettings
      tags: [abstractly]
      summary: Get feed settings
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Saved feed settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedSettings"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No subscription found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateFeedSettings
      tags: [abstractly]
      summary: Update saved feed settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedSettingsInput"
      responses:
        "200":
          description: Updated feed settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedSettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No subscription found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /abstractly/feedback:
    post:
      operationId: savePaperFeedback
      tags: [abstractly]
      summary: Save thumbs-up or thumbs-down feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperFeedbackInput"
      responses:
        "200":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperFeedback"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Paper not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /abstractly/users:
    post:
      operationId: registerUser
      tags: [abstractly]
      summary: Register an email and research topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid signup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /abstractly/login:
    post:
      operationId: loginUser
      tags: [abstractly]
      summary: Find an existing subscription by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLookup"
      responses:
        "200":
          description: Existing subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No subscription found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScoredPaper:
      type: object
      properties:
        paperId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        url:
          type: ["string", "null"]
        relevanceScore:
          type: integer
          minimum: 0
          maximum: 100
        rationale:
          type: string
        feedback:
          type: ["integer", "null"]
          minimum: -1
          maximum: 1
        readLater:
          type: boolean
      required:
        - paperId
        - title
        - abstract
        - year
        - url
        - relevanceScore
        - rationale
        - feedback
        - readLater
    PaperFeedbackInput:
      type: object
      properties:
        paperId:
          type: string
          minLength: 1
        thumbsUpDown:
          type: integer
          enum: [-1, 1]
      required:
        - paperId
        - thumbsUpDown
    PaperFeedback:
      type: object
      properties:
        paperId:
          type: string
        thumbsUpDown:
          type: integer
          enum: [-1, 1]
        message:
          type: string
      required:
        - paperId
        - thumbsUpDown
        - message
    ReadLaterInput:
      type: object
      properties:
        email:
          type: string
          format: email
        paperId:
          type: string
          minLength: 1
        saved:
          type: boolean
      required:
        - email
        - paperId
        - saved
    ReadLaterResponse:
      type: object
      properties:
        paperId:
          type: string
        saved:
          type: boolean
        message:
          type: string
      required:
        - paperId
        - saved
        - message
    UserInput:
      type: object
      properties:
        email:
          type: string
          format: email
        topic:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - email
        - topic
    EmailLookup:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    FeedSettings:
      type: object
      properties:
        email:
          type: string
          format: email
        topic:
          type: string
        relevanceThreshold:
          type: integer
          enum: [50, 70, 90]
      required:
        - email
        - topic
        - relevanceThreshold
    UpdateFeedSettingsInput:
      type: object
      properties:
        email:
          type: string
          format: email
        relevanceThreshold:
          type: integer
          enum: [50, 70, 90]
      required:
        - email
        - relevanceThreshold
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        topic:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - topic
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

